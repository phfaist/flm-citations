name: 'ci'

# Every test the project has, on every push — Rust unit tests and clippy for the
# PyO3 binding, then the offline half of the pytest suite against the extension
# as actually installed.  The `network` tests are deselected: they hit arXiv and
# doi.org, which are rate-limited and would make CI fail for reasons that have
# nothing to do with the commit.
#
# `workflow_call` is here so `build-wheels.yml` can gate publishing on this same
# suite instead of keeping a second copy of it.

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded runs of a branch are pointless; main is the exception, where each
# commit's result is worth keeping.  Including `github.workflow` keeps a
# reusable call from `build-wheels` out of this workflow's own group.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  test:
    name: 'test (${{ matrix.os }}, py${{ matrix.python-version }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor and the current release: `abi3-py39` means anything in
        # between links against the same ABI.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Matches the autocitefetch workspace, which sets the real floor.
          toolchain: '1.86'
          components: clippy

      # Both the git dependency checkout and the build of the dependency tree
      # are worth reusing across runs; the crate itself is small.
      - uses: Swatinem/rust-cache@v2
        with:
          key: 'py${{ matrix.python-version }}'

      - name: 'Rust unit tests'
        # Without `--no-default-features` the `extension-module` feature would
        # be off anyway (it is not a default), so the test harness links
        # libpython as it must.
        run: cargo test

      - name: 'clippy'
        run: cargo clippy --all-targets -- -D warnings

      - name: 'Install the package and its test dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: 'pytest (offline only)'
        run: pytest -m 'not network' -v
