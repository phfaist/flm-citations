name: 'build-wheels'

# Replaces the old poetry-based `deploy-pypi` workflow: the package now ships a
# compiled PyO3 extension, so there is one wheel per platform rather than one
# pure-Python wheel for everything.
#
# The `autocitefetch` dependency is a git dependency on a public repository (see
# Cargo.toml), fetched over anonymous https, so no job needs credentials for it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (otherwise only build and upload artifacts)'
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  # The suite itself lives in `ci.yml`, which runs on every push; calling it
  # here would only duplicate those runs, so this job exists solely as the gate
  # in front of `publish` and runs only when a release is actually being made.
  test:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    uses: ./.github/workflows/ci.yml

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: 'wheels (${{ matrix.platform.runner }}, ${{ matrix.platform.target }})'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64 }
          - { runner: ubuntu-latest,  target: aarch64 }
          - { runner: macos-latest,   target: x86_64 }
          - { runner: macos-latest,   target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `abi3-py39` means one wheel covers every Python from 3.9 up, so
          # this matrix is over platforms only.
          args: --release --out dist
          sccache: 'true'
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [test, sdist, wheels]
    runs-on: ubuntu-latest
    environment: env-deploy-pypi
    permissions:
      # Trusted publishing: no API token to rotate. Configure the publisher at
      # https://pypi.org/manage/project/flm-citations/settings/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
